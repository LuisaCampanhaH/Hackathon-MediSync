<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A2BE2"/>
    </marker>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f0fb"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="460" fill="#ffffff"/>

  <!-- Step 1: App -->
  <g>
    <rect x="30" y="150" width="190" height="160" rx="18" fill="url(#cardGrad)" stroke="#8A2BE2" stroke-width="2"/>
    <text x="125" y="200" font-size="40" text-anchor="middle">📱</text>
    <text x="125" y="238" font-size="16" font-weight="700" text-anchor="middle" fill="#2b2b2b">App Cuidador</text>
    <text x="125" y="260" font-size="12" text-anchor="middle" fill="#555">Cadastra a rotina</text>
    <text x="125" y="276" font-size="12" text-anchor="middle" fill="#555">médica</text>
    <text x="125" y="140" font-size="13" font-weight="700" text-anchor="middle" fill="#8A2BE2">1</text>
  </g>

  <!-- Step 2: API -->
  <g>
    <rect x="270" y="150" width="190" height="160" rx="18" fill="url(#cardGrad)" stroke="#339933" stroke-width="2"/>
    <text x="365" y="200" font-size="40" text-anchor="middle">🗄️</text>
    <text x="365" y="238" font-size="16" font-weight="700" text-anchor="middle" fill="#2b2b2b">API + Banco</text>
    <text x="365" y="260" font-size="12" text-anchor="middle" fill="#555">Node.js salva a</text>
    <text x="365" y="276" font-size="12" text-anchor="middle" fill="#555">agenda no Postgres</text>
    <text x="365" y="140" font-size="13" font-weight="700" text-anchor="middle" fill="#339933">2</text>
  </g>

  <!-- Step 3: ESP32 -->
  <g>
    <rect x="510" y="150" width="190" height="160" rx="18" fill="url(#cardGrad)" stroke="#000000" stroke-width="2"/>
    <text x="605" y="200" font-size="40" text-anchor="middle">📡</text>
    <text x="605" y="238" font-size="16" font-weight="700" text-anchor="middle" fill="#2b2b2b">ESP32 (IoT)</text>
    <text x="605" y="260" font-size="12" text-anchor="middle" fill="#555">Sincroniza via NTP e</text>
    <text x="605" y="276" font-size="12" text-anchor="middle" fill="#555">consulta a agenda</text>
    <text x="605" y="140" font-size="13" font-weight="700" text-anchor="middle" fill="#2b2b2b">3</text>
  </g>

  <!-- Step 4: Ação Física -->
  <g>
    <rect x="750" y="150" width="220" height="160" rx="18" fill="url(#cardGrad)" stroke="#F7B500" stroke-width="2"/>
    <text x="860" y="200" font-size="40" text-anchor="middle">💊</text>
    <text x="860" y="238" font-size="16" font-weight="700" text-anchor="middle" fill="#2b2b2b">Ação Física</text>
    <text x="860" y="260" font-size="12" text-anchor="middle" fill="#555">Motor gira, alarme toca,</text>
    <text x="860" y="276" font-size="12" text-anchor="middle" fill="#555">LEDs sinalizam</text>
    <text x="860" y="140" font-size="13" font-weight="700" text-anchor="middle" fill="#c9950a">4</text>
  </g>

  <!-- forward arrows -->
  <line x1="220" y1="230" x2="264" y2="230" stroke="#8A2BE2" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="230" x2="504" y2="230" stroke="#8A2BE2" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="230" x2="744" y2="230" stroke="#8A2BE2" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 5: Confirmação - loop back -->
  <g>
    <rect x="270" y="360" width="430" height="80" rx="18" fill="#fdf6ff" stroke="#8A2BE2" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="320" y="408" font-size="26" text-anchor="middle">✅</text>
    <text x="490" y="398" font-size="14" font-weight="700" text-anchor="middle" fill="#2b2b2b">5 · Confirmação</text>
    <text x="490" y="418" font-size="12" text-anchor="middle" fill="#555">Paciente aperta o botão → ESP32 confirma na API → cuidador é notificado no App</text>
  </g>

  <path d="M 860 310 C 860 380 700 400 700 400" fill="none" stroke="#8A2BE2" stroke-width="2" stroke-dasharray="5,4"/>
  <path d="M 270 400 C 150 400 125 360 125 314" fill="none" stroke="#8A2BE2" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <text x="500" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#2b2b2b">Fluxo de Dados — MediSync</text>
  <text x="500" y="62" font-size="13" text-anchor="middle" fill="#777">App → API → ESP32 → Ação física → Confirmação</text>
</svg>
