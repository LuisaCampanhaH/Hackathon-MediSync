services:
  postgres:
    image: postgres:16-alpine
    container_name: remedios_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-remedios}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-remedios}
      POSTGRES_DB: ${DB_NAME:-remedios_db}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - remedios_db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-remedios}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  remedios_db_data:
